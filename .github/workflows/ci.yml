name: companion-foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . build ruff==0.12.12
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
  frappe-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:6
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmariadb-dev mariadb-client redis-tools
          npm install --global yarn@1.22.22
          python -m pip install frappe-bench
      - name: Create pinned disposable Bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch v15.98.0 "$RUNNER_TEMP/neuradix-bench"
          cd "$RUNNER_TEMP/neuradix-bench"
          bench set-config -g redis_cache redis://127.0.0.1:6379/0
          bench set-config -g redis_queue redis://127.0.0.1:6379/1
          bench set-config -g redis_socketio redis://127.0.0.1:6379/2
          bench get-app --branch v15.87.2 --skip-assets erpnext https://github.com/frappe/erpnext.git
          bench get-app --skip-assets neuradix_manufacturing_erpnext "$GITHUB_WORKSPACE"
          bench new-site test.localhost --db-host 127.0.0.1 --db-root-password ci-root --admin-password ci-admin --mariadb-user-host-login-scope '%'
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app neuradix_manufacturing_erpnext
          bench --site test.localhost set-config allow_tests true
      - name: Real Frappe capability and guest-denial tests
        run: |
          cd "$RUNNER_TEMP/neuradix-bench"
          bench --site test.localhost run-tests --app neuradix_manufacturing_erpnext
